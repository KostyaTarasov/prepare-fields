[project]
name = "prepare-fields"
version = "0.1.0"
description = "Черновики карточек товаров для B2B-магазина контрольно-измерительных приборов"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
prepare-fields = "prepare_fields.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prepare_fields"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "ARG", "PTH", "C4", "TID"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
